[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tarot-ai-card-forge"
version = "0.4.2"
description = "AI tarot card generator — desktop toolkit for drawing spreads and rendering AI tarot art."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "tarot-forge contributors" }]
keywords = ["tarot", "ai", "diffusion", "spread", "desktop"]
dependencies = [
    "pydantic>=2.7",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
gui = ["PySide6>=6.7"]
diffusion = ["torch>=2.3", "diffusers>=0.29", "safetensors>=0.4"]
dev = ["pytest>=8.2", "ruff>=0.5"]

[project.scripts]
tarot-forge = "tarot_forge.bootstrap.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tarot_forge"]

[tool.ruff]
line-length = 100
target-version = "py311"